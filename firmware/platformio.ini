; Stump Dual-Band RF Recon Monitor v0.3.0-DUALBAND-TDM
; Hardware: Heltec WiFi LoRa 32 V3 (ESP32-S3 + SX1262)
; Build & Flash:
;   pio run -t upload
;   pio device monitor -b 115200

[env:heltec_wifi_lora_32_V3]
platform = espressif32@6.9.0
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    jgromes/RadioLib@7.1.2

build_flags =
    -D STUMP_FW_VERSION=\"0.3.0-DUALBAND-TDM\"
    ; Heltec V3 SX1262 uses a TCXO referenced at 1.8 V on DIO3
    -D STUMP_TCXO_V=1.8
    -D CORE_DEBUG_LEVEL=0
