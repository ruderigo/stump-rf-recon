name: Monorepo CI

on:
  push:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'host/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'firmware/**'
      - 'host/**'
      - '.github/workflows/ci.yml'

jobs:
  build-firmware:
    name: Build Heltec V3 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: |
          python -m pip install --upgrade pip
          pip install platformio

      - name: Compile Heltec V3 Firmware
        working-directory: ./firmware
        run: |
          pio run

  test-host:
    name: Validate Host Suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linters & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f host/requirements.txt ]; then pip install -r host/requirements.txt; fi

      - name: Python Syntax & Lint Check
        working-directory: ./host
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Bash Script Syntax Check
        run: |
          find host -type f -name "*.sh" -exec bash -n {} +
